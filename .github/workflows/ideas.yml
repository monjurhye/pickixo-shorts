name: Image Ideas

# Started on time by the Cloudflare timer worker (timer/worker.js); GitHub's own
# schedule was removed because it ran hours late or not at all.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "both = prompts + Facebook, ideas = prompts only (dashboard button), fb = Facebook only"
        default: "both"
      pack:
        description: "Extra batches of 4 for the prompt pack (0 = normal day)"
        default: "0"
      fb_test_reel:
        description: "Make ONE Facebook reel and schedule it (test)"
        type: boolean
        default: false
      fb_check:
        description: "Only check the Facebook token (posts nothing)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Every-10-minute run: ask the dashboard whether "Make new prompts" was pressed.
      # No press = stop here before any API call (no cost).
      - name: Check for a prompt request
        id: mode
        env:
          PIPELINE_KEY: ${{ secrets.PIPELINE_KEY }}
        run: |
          MODE="${{ inputs.mode || 'both' }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$MODE" = "fb" ]; then
            echo "ideas=false" >> "$GITHUB_OUTPUT"; echo "fb=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$MODE" = "both" ]; then
            echo "ideas=true" >> "$GITHUB_OUTPUT"; echo "fb=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ github.event.schedule }}" = "0 2 * * *" ]; then
            echo "ideas=false" >> "$GITHUB_OUTPUT"; echo "fb=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          R=$(curl -s -m 20 -X POST https://shop.pickixo.com/api/pipeline/ideas \
                -H "X-Pipeline-Key: $PIPELINE_KEY" -H "Content-Type: application/json" \
                -H "User-Agent: pickixo-pipeline/1.0" -d '{"take":true}' || true)
          echo "dashboard: $R"
          # a manual "ideas" run (Actions tab) always makes prompts; the take above still clears a button press
          if echo "$R" | grep -q '"requested":true' || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$MODE" = "ideas" ] && [ "${{ github.actor }}" != "pickixo-bot" ]; }; then echo "ideas=true" >> "$GITHUB_OUTPUT"
          else echo "ideas=false" >> "$GITHUB_OUTPUT"; fi
          echo "fb=false" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.mode.outputs.ideas == 'true' || steps.mode.outputs.fb == 'true'
      - uses: actions/setup-python@v5
        if: steps.mode.outputs.ideas == 'true' || steps.mode.outputs.fb == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.mode.outputs.ideas == 'true' || steps.mode.outputs.fb == 'true'
      - name: Cache Kokoro voice model (free TTS, ~350 MB, downloaded once)
        if: steps.mode.outputs.fb == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/kokoro
          key: kokoro-v1.0
      - name: Make ideas
        if: steps.mode.outputs.ideas == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # free Google Gemini key (no OpenAI cost)
          PIPELINE_KEY: ${{ secrets.PIPELINE_KEY }}
        run: python -m pipeline.image_ideas --pack "${{ inputs.pack || '0' }}"
      # 8am Bangladesh: 3 honest Bangla posts for the "Modern Tech Life" page -> /admin (copy + post by hand).
      # A failure here never stops the Facebook posts below.
      # OFF since 2026-11-22 (OpenAI cost). To turn it back on: repo Settings -> Variables -> MTL_ON = true.
      - name: Modern Tech Life posts
        if: vars.MTL_ON == 'true' && steps.mode.outputs.fb == 'true' && inputs.fb_check != true && inputs.fb_test_reel != true
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # free Google Gemini (no OpenAI)
          PIPELINE_KEY: ${{ secrets.PIPELINE_KEY }}
        run: python -m pipeline.mtl_posts
      - name: Install ffmpeg and fonts (Facebook reels)
        if: steps.mode.outputs.fb == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Facebook posts (ideas + auto-schedule)
        if: steps.mode.outputs.fb == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # free Google Gemini (no OpenAI)
          PIPELINE_KEY: ${{ secrets.PIPELINE_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          FB_PAUSED: ${{ vars.FB_PAUSED }}
        run: |
          if [ "${{ inputs.fb_check }}" = "true" ]; then python -m pipeline.fb_ideas --check; exit 0; fi
          if [ "${{ inputs.fb_test_reel }}" = "true" ]; then python -m pipeline.fb_ideas --test-reel; exit 0; fi
          if [ "$FB_PAUSED" = "true" ]; then echo "Facebook paused"; exit 0; fi
          python -m pipeline.fb_ideas
      - name: Commit prompt pack (updates /free/ai-prompts/)
        if: steps.mode.outputs.ideas == 'true'
        run: |
          git config user.name "pickixo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prompt_pack.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Prompt pack $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
      - name: Commit Modern Tech Life topics (so topics don't repeat)
        if: steps.mode.outputs.fb == 'true'
        run: |
          git config user.name "pickixo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mtl_posts.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "MTL topics $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
