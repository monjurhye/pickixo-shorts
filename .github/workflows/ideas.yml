name: Image Ideas

on:
  schedule:
    - cron: "0 2 * * *"   # 8am Bangladesh: Magnific image ideas to the dashboard
  workflow_dispatch:
    inputs:
      pack:
        description: "Extra batches of 10 for the prompt pack (0 = normal day)"
        default: "0"
      fb_check:
        description: "Only check the Facebook token (posts nothing)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Make ideas
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PIPELINE_KEY: ${{ secrets.PIPELINE_KEY }}
        run: python -m pipeline.image_ideas --pack "${{ inputs.pack || '0' }}"
      - name: Facebook posts (ideas + auto-schedule)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PIPELINE_KEY: ${{ secrets.PIPELINE_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAUSED: ${{ vars.FB_PAUSED }}
        run: |
          if [ "${{ inputs.fb_check }}" = "true" ]; then python -m pipeline.fb_ideas --check; exit 0; fi
          if [ "$FB_PAUSED" = "true" ]; then echo "Facebook paused"; exit 0; fi
          python -m pipeline.fb_ideas
      - name: Commit prompt pack (updates /free/ai-prompts/)
        run: |
          git config user.name "pickixo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prompt_pack.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Prompt pack $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
