name: Image Ideas

on:
  schedule:
    - cron: "0 2 * * *"   # 8am Bangladesh: Magnific image ideas to the dashboard
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Make ideas
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PIPELINE_KEY: ${{ secrets.PIPELINE_KEY }}
        run: python -m pipeline.image_ideas
