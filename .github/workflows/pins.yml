name: Daily Pins

# Started on time by the Cloudflare timer worker (timer/worker.js); GitHub's own
# schedule was removed because it ran hours late or not at all.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (sample product, no API calls, nothing posted)"
        type: boolean
        default: false
      setup:
        description: "List Buffer organizations, channels and Pinterest boards"
        type: boolean
        default: false
      test_ali:
        description: "Only test the AliExpress API (posts nothing)"
        type: boolean
        default: false
      test_impact:
        description: "List Impact programs and catalogs (posts nothing)"
        type: boolean
        default: false
      sync_dashboard:
        description: "Send already posted pins to the dashboard"
        type: boolean
        default: false
      delete_posts:
        description: "Buffer post ids to remove from the queue (comma-separated)"
        default: ""
      test_one:
        description: "Schedule just 1 real pin about 15 minutes from now"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-pins
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Schedule pins
        env:
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PIPELINE_KEY: ${{ secrets.PIPELINE_KEY }}
          IMPACT_ACCOUNT_SID: ${{ secrets.IMPACT_ACCOUNT_SID }}
          IMPACT_AUTH_TOKEN: ${{ secrets.IMPACT_AUTH_TOKEN }}
          PINS_PAUSED: ${{ vars.PINS_PAUSED }}
          DELETE_POSTS: ${{ inputs.delete_posts }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          if [ "${{ inputs.setup }}" = "true" ]; then ARGS="--setup"; fi
          if [ "${{ inputs.test_ali }}" = "true" ]; then ARGS="--test-ali"; fi
          if [ "${{ inputs.test_one }}" = "true" ]; then ARGS="--test-one"; fi
          if [ "${{ inputs.sync_dashboard }}" = "true" ]; then ARGS="--sync-dashboard"; fi
          if [ "${{ inputs.test_impact }}" = "true" ]; then ARGS="--test-impact"; fi
          if [ -n "$DELETE_POSTS" ]; then python -m pipeline.run_pins --delete-posts "$DELETE_POSTS"; exit 0; fi
          python -m pipeline.run_pins $ARGS
      - name: Commit pin records
        if: ${{ !inputs.dry_run && !inputs.setup && !inputs.test_ali && !inputs.sync_dashboard && !inputs.test_impact }}
        run: |
          git config user.name "pickixo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pins.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Pin records $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
