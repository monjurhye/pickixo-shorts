name: Recover Records

# Manual: rebuild website records for Shorts that are on YouTube but missing from
# data/videos (a run whose records push failed). Reads uploads with youtube.readonly.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "UTC date of the lost videos (YYYY-MM-DD)"
        required: true

permissions:
  contents: write

concurrency:
  group: daily-shorts   # never at the same time as a Shorts run (both write data/)
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild missing records
        env:
          PIPELINE_KEY: ${{ secrets.PIPELINE_KEY }}
        run: python -m tools.recover_records "${{ inputs.date }}"
      - name: Commit records (updates the website)
        run: |
          git config user.name "pickixo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Recovered records ${{ inputs.date }}"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && exit 0; sleep $((i * 10)); done
          exit 1
