name: Medium Drafts

# Started on time by the Cloudflare timer worker (timer/worker.js); GitHub's own
# schedule was removed because it ran hours late or not at all.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (sample deals, no API calls)"
        type: boolean
        default: false
      locker_only:
        description: "Only the AdBlueMedia how-to article"
        type: boolean
        default: false
      deals_only:
        description: "Only refresh the free deals page list (no draft)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: medium-drafts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Make draft
        env:
          IMPACT_ACCOUNT_SID: ${{ secrets.IMPACT_ACCOUNT_SID }}
          IMPACT_AUTH_TOKEN: ${{ secrets.IMPACT_AUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # free Google Gemini (no OpenAI)
          PIPELINE_KEY: ${{ secrets.PIPELINE_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          if [ "${{ inputs.deals_only }}" = "true" ]; then ARGS="--deals-only"; fi
          if [ "${{ inputs.locker_only }}" = "true" ]; then python -m pipeline.locker_articles; exit 0; fi
          python -m pipeline.medium_drafts $ARGS
          # second article of the day: a how-to that offers the AdBlueMedia free resources
          if [ -z "$ARGS" ]; then python -m pipeline.locker_articles || echo "locker article failed"; fi
      - name: Commit draft records
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "pickixo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/medium.json data/free_deals.json data/blog data/locker_articles.json 2>/dev/null || git add data/medium.json data/free_deals.json data/blog 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Medium draft records $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
