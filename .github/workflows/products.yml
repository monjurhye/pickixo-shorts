name: Product Finder

# Finds real Amazon products (ASINs) per channel with web search, keeps only ASINs from
# amazon.com URLs the search returned, writes data/products.json. Runs before the first
# daily video run; channels that already have 8+ fresh products are skipped (no API cost).
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Only this channel id (empty = all that need it)"
        default: ""
      force:
        description: "Search again even if the channel has enough products"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: product-finder
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Find products
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.channel }}" ]; then ARGS="--channel ${{ inputs.channel }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python -m pipeline.product_finder $ARGS
      - name: Commit products
        run: |
          git config user.name "pickixo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Products $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
