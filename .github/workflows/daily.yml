name: Daily Shorts

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC = 8-9am US Eastern / 7pm Bangladesh
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (sample script, no API calls, no upload)"
        type: boolean
        default: false
      test_no_upload:
        description: "Test with real OpenAI + Pexels, but no upload and no website change"
        type: boolean
        default: false
      channel:
        description: "Only this channel id (e.g. ch01), blank = all enabled"
        required: false
        default: ""

permissions:
  contents: write   # commit data/ so the site updates
  issues: write     # daily report issue (GitHub emails it to you)

concurrency:
  group: daily-shorts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Make and upload videos
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}          # YT_REFRESH_CH01..CH20 etc.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PAUSED: ${{ vars.PAUSED }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.test_no_upload }}" = "true" ]; then ARGS="$ARGS --no-upload"; fi
          if [ -n "${{ inputs.channel }}" ]; then ARGS="$ARGS --channel ${{ inputs.channel }}"; fi
          python -m pipeline.run_daily $ARGS

      - name: Keep test videos for 2 days
        if: ${{ inputs.dry_run || inputs.test_no_upload }}
        uses: actions/upload-artifact@v4
        with:
          name: test-videos
          path: work/**/*.mp4
          retention-days: 2

      - name: Commit records (updates the website)
        if: ${{ !inputs.dry_run && !inputs.test_no_upload }}
        run: |
          git config user.name "pickixo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily records $(date -u +%F)"
          git push
