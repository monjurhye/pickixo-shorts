name: Daily Shorts

# Started on time by the Cloudflare timer worker (timer/worker.js); GitHub's own
# schedule was removed because it ran hours late or not at all.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (sample script, no API calls, no upload)"
        type: boolean
        default: false
      test_no_upload:
        description: "Test with real OpenAI + Pexels, but no upload and no website change"
        type: boolean
        default: false
      channel:
        description: "Only this channel id (e.g. ch01), blank = all enabled"
        required: false
        default: ""

permissions:
  contents: write   # commit data/ so the site updates
  issues: write     # daily report issue (GitHub emails it to you)

concurrency:
  group: daily-shorts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Cache Kokoro voice model (free TTS, ~350 MB, downloaded once)
        uses: actions/cache@v4
        with:
          path: ~/.cache/kokoro
          key: kokoro-v1.0

      - name: Make and upload videos
        env:
          # Each secret by name (passing all secrets as one blob gets the workflow
          # flagged by GitHub). Add a line here if you add a channel past ch20.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # free Google Gemini (no OpenAI)
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIPELINE_KEY: ${{ secrets.PIPELINE_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_CH01: ${{ secrets.YT_REFRESH_CH01 }}
          YT_REFRESH_CH02: ${{ secrets.YT_REFRESH_CH02 }}
          YT_REFRESH_CH03: ${{ secrets.YT_REFRESH_CH03 }}
          YT_REFRESH_CH04: ${{ secrets.YT_REFRESH_CH04 }}
          YT_REFRESH_CH05: ${{ secrets.YT_REFRESH_CH05 }}
          YT_REFRESH_CH06: ${{ secrets.YT_REFRESH_CH06 }}
          YT_REFRESH_CH07: ${{ secrets.YT_REFRESH_CH07 }}
          YT_REFRESH_CH08: ${{ secrets.YT_REFRESH_CH08 }}
          YT_REFRESH_CH09: ${{ secrets.YT_REFRESH_CH09 }}
          YT_REFRESH_CH10: ${{ secrets.YT_REFRESH_CH10 }}
          YT_REFRESH_CH11: ${{ secrets.YT_REFRESH_CH11 }}
          YT_REFRESH_CH12: ${{ secrets.YT_REFRESH_CH12 }}
          YT_REFRESH_CH13: ${{ secrets.YT_REFRESH_CH13 }}
          YT_REFRESH_CH14: ${{ secrets.YT_REFRESH_CH14 }}
          YT_REFRESH_CH15: ${{ secrets.YT_REFRESH_CH15 }}
          YT_REFRESH_CH16: ${{ secrets.YT_REFRESH_CH16 }}
          YT_REFRESH_CH17: ${{ secrets.YT_REFRESH_CH17 }}
          YT_REFRESH_CH18: ${{ secrets.YT_REFRESH_CH18 }}
          YT_REFRESH_CH19: ${{ secrets.YT_REFRESH_CH19 }}
          YT_REFRESH_CH20: ${{ secrets.YT_REFRESH_CH20 }}
          PAUSED: ${{ vars.PAUSED }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.test_no_upload }}" = "true" ]; then ARGS="$ARGS --no-upload"; fi
          if [ -n "${{ inputs.channel }}" ]; then ARGS="$ARGS --channel ${{ inputs.channel }}"; fi
          python -m pipeline.run_daily $ARGS

      - name: Cross-post the best Shorts (Facebook, Instagram, Threads, Bluesky)
        if: ${{ !inputs.dry_run && !inputs.test_no_upload && !inputs.channel }}
        continue-on-error: true
        env:
          PIPELINE_KEY: ${{ secrets.PIPELINE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PAUSED: ${{ vars.PAUSED }}
        run: |
          if [ "$PAUSED" = "true" ]; then echo "paused"; exit 0; fi
          python -m pipeline.xpost

      - name: Keep test videos for 2 days
        if: ${{ inputs.dry_run || inputs.test_no_upload }}
        uses: actions/upload-artifact@v4
        with:
          name: test-videos
          path: work/*/20*.mp4
          retention-days: 2

      - name: Commit records (updates the website)
        if: ${{ !inputs.dry_run && !inputs.test_no_upload }}
        run: |
          git config user.name "pickixo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily records $(date -u +%F)"
          git push
