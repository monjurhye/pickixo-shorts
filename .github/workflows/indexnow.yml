name: IndexNow

# After new pages are pushed (daily records), wait for Cloudflare Pages to deploy,
# then tell Bing / Yandex / other IndexNow engines. Free, no API cost.
on:
  push:
    branches: [main]
    paths: ["data/videos/**", "data/blog/**", "data/free_deals.json", "data/prompt_pack.json"]
  workflow_dispatch:
    inputs:
      all:
        description: "Send every page (not only the last 2 days)"
        type: boolean
        default: false

concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait for the Pages deploy
        run: sleep 240
      - name: Submit URLs
        run: |
          if [ "${{ inputs.all }}" = "true" ]; then python -m pipeline.indexnow
          else python -m pipeline.indexnow --new 2; fi
